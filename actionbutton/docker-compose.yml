version: "3.8"

services:
  grist:
    image: gristlabs/grist:latest
    container_name: grist
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      # Persist Grist data (docs, metadata)
      - grist-data:/persist

      # ── Widget plugin mount ──
      # Mounts the entire grist-widget repo so Grist serves all widgets.
      # Grist scans $GRIST_USER_ROOT/plugins/ for manifest.yml files.
      - ../../:/grist/user/plugins/widgets:ro
      # Adjust the host path above if docker-compose.yml lives elsewhere.
      # Relative path assumes this file is at:
      #   grist-widget/actionbutton/docker-compose.yml
      # So ../../ goes up two levels to grist-widget/
    env_file:
      - ./widget-env-vars/grist.env
    environment:
      # Grist_USER_ROOT is already set in grist.env, but can be overridden here
      # GRIST_USER_ROOT: /grist/user

      # ── Optional: uncomment for production ──
      # GRIST_SECRET: "${GRIST_SECRET:?Set GRIST_SECRET in .env}"
      # GRIST_DOCS_DATABASE_URL: postgres://grist:${DB_PASSWORD}@db:5432/grist

volumes:
  grist-data:
