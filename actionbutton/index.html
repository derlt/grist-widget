<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Grist Action Button</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.3/vue.min.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="actionbutton.js?ver=4"></script>
    <link rel="stylesheet" href="actionbutton.css?ver=4">
  </head>
  <body>
    <div id="app">
      <!-- Config panel -->
      <div class="ab-config" v-if="config">
        <div class="ab-config-row">
          <label class="ab-config-label">Button Variant</label>
          <select class="ab-config-select" v-model="draftOptions.variant">
            <option value="primary">Primary</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Danger</option>
            <option value="neutral">Neutral</option>
          </select>
        </div>
        <div class="ab-config-row">
          <label class="ab-config-label">Button Size</label>
          <select class="ab-config-select" v-model="draftOptions.size">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="ab-config-row">
          <label class="ab-config-label">Default Icon</label>
          <select class="ab-config-select" v-model="draftOptions.icon">
            <option value="">None</option>
            <option v-for="name in ICON_NAMES" :value="name">{{ name }}</option>
          </select>
          <p class="ab-config-hint">Applies to all buttons unless overridden per button with an "icon" field.</p>
        </div>
        <div class="ab-config-row">
          <label class="ab-config-label">Layout</label>
          <select class="ab-config-select" v-model="draftOptions.layout">
            <option value="horizontal">Horizontal (wrapping)</option>
            <option value="vertical">Vertical (stacked)</option>
            <option value="grid">Grid</option>
          </select>
        </div>
        <div class="ab-config-row" v-if="draftOptions.layout === 'grid'">
          <label class="ab-config-label">Grid Columns</label>
          <select class="ab-config-select" v-model="draftOptions.gridColumns">
            <option value="auto">Auto-fit</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="ab-config-preview">
          <button class="button"
                  :class="'ab-variant-' + draftOptions.variant + ' ab-size-' + draftOptions.size">
            <span class="ab-icon" v-if="draftOptions.icon" v-html="iconSvg(draftOptions.icon)"></span>
            Preview
          </button>
        </div>
        <div class="ab-config-actions">
          <button class="ab-config-cancel" v-on:click="cancelConfig">Cancel</button>
          <button class="ab-config-save" v-on:click="saveConfig">Save</button>
        </div>
      </div>

      <!-- Confirm dialog overlay -->
      <div class="confirm-overlay" v-if="confirmDialog" v-on:click.self="cancelConfirm">
        <div class="confirm-dialog">
          <p class="confirm-text">{{ confirmDialog.confirmText }}</p>
          <div class="confirm-actions">
            <button class="button confirm-cancel" v-on:click="cancelConfirm">Cancel</button>
            <button class="button confirm-ok" v-on:click="doConfirm">Confirm</button>
          </div>
        </div>
      </div>

      <!-- Main view -->
      <template v-if="!config">
        <div class="status" v-if="status">
          <template v-if="status === 'waiting'">
            <p>Waiting for data...</p>
          </template>
          <template v-else>
            {{ status }}
          </template>
        </div>
        <template v-else>
          <div class="group" v-for="(group, groupIdx) in buttonGroups" :key="groupIdx">
            <div class="group-label">{{ group.label }}</div>
            <div :class="containerClasses()">
              <button v-for="(btn, btnIdx) in group.buttons"
                      :class="buttonClasses(btn)"
                      v-on:click="applyActions(btn.actions, btn.confirm, btn.confirmText)"
                      v-on:mouseover="descGroup = groupIdx; descIdx = btnIdx"
                      v-on:mouseleave="descGroup = null; descIdx = null">
                <span class="ab-icon" v-if="effectiveIcon(btn)" v-html="iconSvg(effectiveIcon(btn))"></span>
                {{ btn.button }}
              </button>
            </div>
            <div class="description" v-if="descGroup === groupIdx && descIdx !== null">
              {{ group.buttons[descIdx].description }}
            </div>
            <hr class="group-separator" v-if="groupIdx < buttonGroups.length - 1">
          </div>
          <div class="message" v-if="message">{{ message }}</div>
        </template>
      </template>
    </div>
  </body>
</html>
