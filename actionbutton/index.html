<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Grist Action Button</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.3/vue.min.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="actionbutton.js?ver=2"></script>
    <link rel="stylesheet" href="actionbutton.css?ver=2">
  </head>
  <body>
    <div id="app">
      <div class="status" v-if="status">
        <template v-if="status === 'waiting'">
          <p>Waiting for data...</p>
        </template>
        <template v-else>
          {{ status }}
        </template>
      </div>
      <template v-else>
        <div class="group" v-for="(group, groupIdx) in buttonGroups" :key="groupIdx">
          <div class="group-label">{{ group.label }}</div>
          <div class="group-container">
            <button class="button"
                    v-for="(btn, btnIdx) in group.buttons"
                    v-on:click="applyActions(btn.actions)"
                    v-on:mouseover="descGroup = groupIdx; descIdx = btnIdx"
                    v-on:mouseleave="descGroup = null; descIdx = null">
              {{ btn.button }}
            </button>
          </div>
          <div class="description" v-if="descGroup === groupIdx && descIdx !== null">
            {{ group.buttons[descIdx].description }}
          </div>
          <hr class="group-separator" v-if="groupIdx < buttonGroups.length - 1">
        </div>
        <div class="message" v-if="message">{{ message }}</div>
      </template>
    </div>
  </body>
</html>
