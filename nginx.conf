server {
    listen 80;
    server_name _;

    # Serve all widgets under /widgets/ (e.g. /widgets/actionbutton/index.html)
    location /widgets/ {
        alias /usr/share/nginx/html/widgets/;
        autoindex off;
    }

    # Proxy everything else to Grist
    location / {
        proxy_pass http://grist:8484;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
