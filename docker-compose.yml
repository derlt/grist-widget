version: "3.8"

services:
  grist:
    image: gristlabs/grist:latest
    container_name: grist
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      # Persist Grist data (docs, metadata)
      - grist-data:/persist

      # ── Widget plugin mount ──
      # Mounts the entire repo root so Grist serves widget files
      # via Plugin Discovery. Symlinks in plugins/my-widgets/ point
      # back to each widget's directory (e.g. ../../actionbutton).
      - .:/grist/user:ro

    env_file:
      - ./widget.env
    environment:
      # GRIST_USER_ROOT is already in widget.env
      # ── Optional: uncomment for production ──
      # GRIST_SECRET: "${GRIST_SECRET:?Set GRIST_SECRET in .env}"
      # GRIST_DOCS_DATABASE_URL: postgres://grist:${DB_PASSWORD}@db:5432/grist

volumes:
  grist-data:
